<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laws of Thermodynamics — How Biophysical Systems Work</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; background: #faf8f5; color: #1a1a1a; padding: 2rem; max-width: 780px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: normal; margin-bottom: 0.25rem; letter-spacing: -0.01em; }
    .subtitle { font-size: 0.82rem; color: #888; margin-bottom: 1.25rem; }
    canvas { display: block; border: 1.5px solid #1a1a1a; border-radius: 4px; width: 100%; background: #fff; }
    .desc { font-size: 0.88rem; color: #444; line-height: 1.65; margin: 1rem 0; min-height: 4.5em; }
    nav { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.25rem; }
    button { font-family: 'Georgia', serif; font-size: 0.82rem; padding: 0.45rem 1.1rem; border: 1.5px solid #1a1a1a; background: #faf8f5; cursor: pointer; border-radius: 3px; }
    button:hover { background: #1a1a1a; color: #faf8f5; }
    button:disabled { opacity: 0.3; cursor: default; }
    .step-ct { font-size: 0.78rem; color: #aaa; margin-left: auto; }
  </style>
</head>
<body>
  <h1>Laws of Thermodynamics</h1>
  <p class="subtitle">Four physical laws that govern all energy — including every economic process</p>
  <canvas id="c" height="320"></canvas>
  <p class="desc" id="desc"></p>
  <nav>
    <button id="prev">← Back</button>
    <button id="next">Next →</button>
    <span class="step-ct" id="ct"></span>
  </nav>

  <script>
  (function () {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth || 720;
    let W = canvas.width, H = canvas.height;

    const BC = '#4a3a6b';

    function clear() { ctx.fillStyle = '#faf8f5'; ctx.fillRect(0, 0, W, H); }

    function txt(s, x, y, o) {
      o = o || {};
      ctx.save();
      ctx.font = (o.weight||'normal') + ' ' + (o.size||13) + 'px Georgia,serif';
      ctx.fillStyle = o.color || '#1a1a1a';
      ctx.textAlign = o.align || 'center';
      ctx.textBaseline = o.baseline || 'middle';
      if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
      ctx.fillText(s, x, y);
      ctx.restore();
    }

    function rr(x, y, w, h, r) {
      if (ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
    }

    function arr(x1, y1, x2, y2, color, lw) {
      color = color||'#888'; lw = lw||1.5;
      const ang = Math.atan2(y2-y1, x2-x1), hl = 8;
      ctx.save();
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2-hl*Math.cos(ang-0.4), y2-hl*Math.sin(ang-0.4));
      ctx.lineTo(x2-hl*Math.cos(ang+0.4), y2-hl*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function line(x1,y1,x2,y2,color,lw) {
      ctx.save(); ctx.strokeStyle=color||'#888'; ctx.lineWidth=lw||1;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
    }

    function banner(label) {
      ctx.save(); ctx.fillStyle = BC;
      ctx.beginPath(); rr(0,0,W,50,0); ctx.fill();
      ctx.font = 'bold 17px Georgia,serif'; ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, W/2, 25);
      ctx.restore();
    }

    function notebox(text1, text2) {
      const y = H*0.78;
      ctx.save();
      ctx.fillStyle = BC+'18'; ctx.strokeStyle = BC+'55'; ctx.lineWidth = 1;
      ctx.beginPath(); rr(W*0.05, y, W*0.9, 46, 5); ctx.fill(); ctx.stroke();
      ctx.restore();
      txt(text1, W/2, y+14, {size:11.5, color:BC, weight:'bold'});
      txt(text2, W/2, y+31, {size:11, color:'#555'});
    }

    function tempBox(cx, cy, label, temp, color) {
      const bw = 90, bh = 64;
      ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = 0.15;
      ctx.beginPath(); rr(cx-bw/2, cy-bh/2, bw, bh, 8); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); rr(cx-bw/2, cy-bh/2, bw, bh, 8); ctx.stroke();
      ctx.restore();
      txt(label, cx, cy-14, {size:10, weight:'bold', color:color});
      txt(temp, cx, cy+6, {size:14, weight:'bold', color:color});
    }

    // ── Zeroth Law ────────────────────────────────────────────────────────────
    function drawZeroth() {
      clear(); banner('Zeroth Law · Thermal Equilibrium');

      txt('If A = B in temperature, and B = C in temperature, then A = C.', W/2, H*0.20, {size:11.5, weight:'bold'});
      txt('Temperature is a real, comparable, transitive property of matter.', W/2, H*0.28, {size:10.5, color:'#555'});

      // Three objects A, B (thermometer), C
      const ay = H*0.52, bx = W*0.50, by = H*0.52, cy2 = H*0.52;
      const ax = W*0.18, cx = W*0.82;

      // Connecting lines (equilibrium)
      line(ax+46, ay, bx-30, by, '#b0b0b0', 1.5);
      line(bx+30, by, cx-46, cy2, '#b0b0b0', 1.5);

      // Therefore A=C (dashed)
      ctx.save(); ctx.strokeStyle = '#2a7a2a'; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(ax+46, ay+16); ctx.lineTo(cx-46, cy2+16); ctx.stroke();
      ctx.restore();
      txt('∴ same temperature', W/2, ay+36, {size:10, color:'#2a7a2a', weight:'bold'});

      // A: hot coffee
      tempBox(ax, ay, 'Coffee', '80°C', '#c06020');
      // B: thermometer (the reference)
      ctx.save(); ctx.fillStyle = '#4a3a6b'; ctx.globalAlpha = 0.15;
      ctx.beginPath(); rr(bx-22, by-36, 44, 72, 6); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.strokeStyle = BC; ctx.lineWidth = 1.5;
      ctx.beginPath(); rr(bx-22, by-36, 44, 72, 6); ctx.stroke();
      ctx.restore();
      txt('thermo-', bx, by-18, {size:9.5, weight:'bold', color:BC});
      txt('meter', bx, by-4, {size:9.5, weight:'bold', color:BC});
      txt('80°C', bx, by+18, {size:13, weight:'bold', color:BC});
      // C: hot soup
      tempBox(cx, cy2, 'Soup', '80°C', '#c04020');

      notebox('The thermometer works because temperature is transitive.',
        'Objects at the same temperature will not exchange heat — even if they never touch each other directly.');
    }

    // ── First Law ─────────────────────────────────────────────────────────────
    function drawFirst() {
      clear(); banner('First Law · Conservation of Energy');

      txt('Energy cannot be created or destroyed — only converted from one form to another.', W/2, H*0.20, {size:11.5, weight:'bold'});

      // Input box (orange)
      const iy = H*0.34, iw = W*0.20, ih = H*0.28, ix = W*0.05;
      ctx.save(); ctx.fillStyle = '#e09820'; ctx.globalAlpha = 0.85;
      ctx.beginPath(); rr(ix,iy,iw,ih,8); ctx.fill(); ctx.restore();
      txt('ENERGY', ix+iw/2, iy+ih*0.36, {size:11, weight:'bold', color:'#fff'});
      txt('IN', ix+iw/2, iy+ih*0.56, {size:11, color:'#fff'});
      txt('100 units', ix+iw/2, iy+ih*0.78, {size:9.5, color:'rgba(255,255,255,0.8)'});

      // Branch
      const bx = ix+iw+8, midY = iy+ih/2;
      line(bx, midY, bx+18, midY, '#999', 2);
      line(bx+18, midY, bx+18, iy+ih*0.22, '#999', 2);
      line(bx+18, midY, bx+18, iy+ih*0.78, '#999', 2);

      const obx = bx+22, obw = W*0.36;

      // Work output (green)
      const wby = iy, wbh = ih*0.40;
      ctx.save(); ctx.fillStyle = '#2a7a2a'; ctx.globalAlpha = 0.75;
      ctx.beginPath(); rr(obx,wby,obw,wbh,8); ctx.fill(); ctx.restore();
      line(bx+18, iy+ih*0.22, obx, wby+wbh/2, '#999', 2);
      txt('USEFUL WORK', obx+obw/2, wby+wbh*0.38, {size:11, weight:'bold', color:'#fff'});
      txt('~30–40% of input', obx+obw/2, wby+wbh*0.70, {size:10, color:'rgba(255,255,255,0.85)'});

      // Heat output (red)
      const hby = iy+ih*0.60, hbh = ih*0.40;
      ctx.save(); ctx.fillStyle = '#b03010'; ctx.globalAlpha = 0.68;
      ctx.beginPath(); rr(obx,hby,obw,hbh,8); ctx.fill(); ctx.restore();
      line(bx+18, iy+ih*0.78, obx, hby+hbh/2, '#999', 2);
      txt('WASTE HEAT', obx+obw/2, hby+hbh*0.38, {size:11, weight:'bold', color:'#fff'});
      txt('~60–70% of input', obx+obw/2, hby+hbh*0.70, {size:10, color:'rgba(255,255,255,0.85)'});

      // Examples on right
      const ex = obx+obw+18;
      txt('Every process:', ex, iy+ih*0.15, {size:10, color:'#555', align:'left'});
      ['car engine', 'human body', 'power station', 'factory'].forEach((e,i) => {
        txt('· ' + e, ex, iy+ih*0.15+20+i*18, {size:10, color:'#777', align:'left'});
      });

      notebox('You cannot make energy — only convert it. Work + heat always equals input.',
        'This is why "free energy" doesn\'t exist. Every machine needs a real energy source.');
    }

    // ── Second Law ────────────────────────────────────────────────────────────
    function drawSecond() {
      clear(); banner('Second Law · The One-Way Rule');

      txt('Every real process increases the total disorder of the universe.', W/2, H*0.20, {size:11.5, weight:'bold'});
      txt('Concentrated energy spreads out. Order disperses. This only goes one way.', W/2, H*0.28, {size:10.5, color:'#555'});

      const midY = H*0.52;
      const lcx = W*0.22, rcx = W*0.78;

      // Left panel: ordered state
      ctx.save(); ctx.fillStyle = '#2a5a8a'; ctx.globalAlpha = 0.10;
      ctx.beginPath(); rr(lcx-70, midY-52, 140, 104, 8); ctx.fill();
      ctx.globalAlpha = 0.35; ctx.strokeStyle = '#2a5a8a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); rr(lcx-70, midY-52, 140, 104, 8); ctx.stroke();
      ctx.restore();
      txt('ORDERED', lcx, midY-40, {size:10, weight:'bold', color:'#2a5a8a'});
      txt('concentrated · low entropy', lcx, midY+46, {size:9, color:'#2a5a8a'});
      [[-10,-18],[8,-14],[-4,-2],[10,6],[-8,14],[2,20],[-14,6]].forEach(([dx,dy]) => {
        ctx.save(); ctx.fillStyle = '#2a5a8a'; ctx.globalAlpha = 0.65;
        ctx.beginPath(); ctx.arc(lcx+dx, midY+dy, 7, 0, Math.PI*2); ctx.fill(); ctx.restore();
      });

      // One-way arrow
      arr(lcx+72, midY, rcx-72, midY, '#444', 3);
      txt('ONLY ONE WAY', W/2, midY-18, {size:10, weight:'bold', color:'#444'});
      // No-return mark
      ctx.save(); ctx.strokeStyle = '#cc2020'; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.moveTo(W/2-8, midY+14); ctx.lineTo(W/2+8, midY+28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W/2+8, midY+14); ctx.lineTo(W/2-8, midY+28); ctx.stroke();
      ctx.restore();
      txt('no return', W/2, midY+40, {size:9, color:'#cc2020'});

      // Right panel: disordered state
      ctx.save(); ctx.fillStyle = '#888'; ctx.globalAlpha = 0.08;
      ctx.beginPath(); rr(rcx-70, midY-52, 140, 104, 8); ctx.fill();
      ctx.globalAlpha = 0.25; ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5;
      ctx.beginPath(); rr(rcx-70, midY-52, 140, 104, 8); ctx.stroke();
      ctx.restore();
      txt('DISORDERED', rcx, midY-40, {size:10, weight:'bold', color:'#888'});
      txt('dispersed · high entropy', rcx, midY+46, {size:9, color:'#888'});
      [[-42,-28],[22,-38],[-20,-10],[46,4],[-36,20],[12,34],[38,22],[-8,40],[28,-18]].forEach(([dx,dy]) => {
        ctx.save(); ctx.fillStyle = '#bbb'; ctx.globalAlpha = 0.55;
        ctx.beginPath(); ctx.arc(rcx+dx*0.75, midY+dy*0.75, 5, 0, Math.PI*2); ctx.fill(); ctx.restore();
      });

      notebox('Cream in coffee. Wood burning to ash. Heat flowing to cold. None reverse on their own.',
        'This law is why extraction is a one-way door — and why "recycling" and "carbon capture" have hard limits.');
    }

    // ── Third Law ─────────────────────────────────────────────────────────────
    function drawThird() {
      clear(); banner('Third Law · Absolute Zero');

      txt('As temperature approaches absolute zero, entropy approaches its minimum.', W/2, H*0.20, {size:11.5, weight:'bold'});
      txt('Absolute zero (−273°C) cannot be reached. Perfect efficiency is physically impossible.', W/2, H*0.28, {size:10.5, color:'#555'});

      // Temperature axis (horizontal) and entropy curve
      const axX = W*0.10, axY = H*0.68, axW = W*0.55;
      // Axes
      line(axX, axY, axX+axW, axY, '#ccc', 1.5);
      line(axX, H*0.30, axX, axY+8, '#ccc', 1.5);
      txt('Temperature →', axX+axW/2, axY+18, {size:9.5, color:'#888'});
      txt('Entropy', axX-14, H*0.48, {size:9.5, color:'#888'});
      txt('↑', axX-14, H*0.40, {size:11, color:'#888'});

      // Axis labels
      txt('absolute zero', axX, axY+30, {size:9, color:'#c03020'});
      txt('(unreachable)', axX, axY+42, {size:9, color:'#c03020'});
      txt('room temp', axX+axW*0.5, axY+18, {size:9, color:'#888'});

      // Entropy curve (approaches zero asymptotically as temp → 0)
      ctx.save(); ctx.strokeStyle = BC; ctx.lineWidth = 2.5; ctx.globalAlpha = 0.8;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const t = i / 100;
        const px = axX + t * axW;
        // entropy ~ 0 at T=0, rising steeply then flattening
        const ent = Math.pow(t, 0.45);
        const py = axY - ent * (axY - H*0.32);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke(); ctx.restore();

      // Vertical dashed line at absolute zero
      ctx.save(); ctx.strokeStyle = '#c03020'; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.5;
      ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(axX, H*0.32); ctx.lineTo(axX, axY); ctx.stroke();
      ctx.restore();

      // Dot at curve origin
      ctx.save(); ctx.fillStyle = '#c03020'; ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.arc(axX, axY, 5, 0, Math.PI*2); ctx.fill(); ctx.restore();

      // Right side: what this means
      const rx = W*0.70, ry = H*0.34;
      txt('What this means:', rx, ry, {size:10.5, weight:'bold', color:'#555'});
      const lines2 = [
        ['No process can reach', 'absolute zero'],
        ['No engine can be', '100% efficient'],
        ['There is always', 'a minimum waste'],
      ];
      lines2.forEach(([l1,l2], i) => {
        txt(l1, rx, ry+26+i*46, {size:10, color:'#555'});
        txt(l2, rx, ry+40+i*46, {size:10, weight:'bold', color:BC});
      });

      notebox('Perfect efficiency is not an engineering problem — it is a physical impossibility.',
        'The Third Law sets a hard floor. You can improve how close you get, but never reach the limit.');
    }

    const STEPS = [
      { draw: drawZeroth,
        desc: 'The Zeroth Law establishes that temperature is a real, measurable, transitive property. If object A is in thermal equilibrium with object B (same temperature, no heat flows between them), and B is in equilibrium with C, then A and C are also in equilibrium — even if they\'ve never touched. This is why a thermometer works: it acts as the "B" that lets you compare temperatures of things you can\'t put side by side. Without this law, temperature wouldn\'t be a consistent, comparable quantity, and the other laws couldn\'t be stated.' },
      { draw: drawFirst,
        desc: 'The First Law: energy is conserved. It cannot be created or destroyed — only converted from one form to another. When you burn fuel, the chemical energy doesn\'t vanish: it becomes mechanical work, heat, light, and sound — and all of those add up to exactly what you started with. A car engine, a human body, a power station: all take in concentrated energy and produce useful work plus unavoidable waste heat. "Making energy" is a misnomer — you can only convert it. This is why every process needs a real energy source.' },
      { draw: drawSecond,
        desc: 'The Second Law: every real process increases the total disorder (entropy) of the universe. Concentrated energy spreads out. Ordered things become disordered. Heat flows from hot to cold — never the reverse on its own. Cream stirred into coffee never unspreads. Wood burned to ash never re-forms. You can create local order — rebuild a house, grow a plant, charge a battery — but only by importing energy from outside, and that conversion adds more disorder to the total system than the local order it creates. The universe always trends toward more disorder.' },
      { draw: drawThird,
        desc: 'The Third Law: as a system\'s temperature approaches absolute zero (−273.15°C), its entropy approaches a minimum. Two consequences follow. First, absolute zero is unreachable — you can get arbitrarily close but never there, because each step of cooling takes more work than the last. Second, no engine or process can be perfectly efficient, because perfect efficiency would require operating at absolute zero. The Third Law sets a physical ceiling on how good any heat engine can ever be — not as a practical limitation but as a law of nature.' },
    ];

    let step = 0;
    const descEl  = document.getElementById('desc');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const ctEl    = document.getElementById('ct');

    function render() {
      STEPS[step].draw();
      descEl.textContent = STEPS[step].desc;
      prevBtn.disabled = (step === 0);
      nextBtn.disabled = (step === STEPS.length - 1);
      ctEl.textContent  = (step + 1) + ' of ' + STEPS.length;
    }

    prevBtn.addEventListener('click', () => { if (step > 0) { step--; render(); } });
    nextBtn.addEventListener('click', () => { if (step < STEPS.length-1) { step++; render(); } });

    render();
    window.addEventListener('resize', () => { canvas.width = canvas.offsetWidth; W = canvas.width; render(); });
  })();
  </script>
  <script src="nav.js"></script>
</body>
</html>
