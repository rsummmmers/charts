<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laws of Thermodynamics — How Biophysical Systems Work</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; background: #faf8f5; color: #1a1a1a; padding: 2rem; max-width: 780px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: normal; margin-bottom: 0.25rem; letter-spacing: -0.01em; }
    .subtitle { font-size: 0.82rem; color: #888; margin-bottom: 1.25rem; }
    canvas { display: block; border: 1.5px solid #1a1a1a; border-radius: 4px; width: 100%; background: #fff; }
    .desc { font-size: 0.88rem; color: #444; line-height: 1.65; margin: 1rem 0; min-height: 4.5em; }
    nav { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.25rem; }
    button { font-family: 'Georgia', serif; font-size: 0.82rem; padding: 0.45rem 1.1rem; border: 1.5px solid #1a1a1a; background: #faf8f5; cursor: pointer; border-radius: 3px; }
    button:hover { background: #1a1a1a; color: #faf8f5; }
    button:disabled { opacity: 0.3; cursor: default; }
    .step-ct { font-size: 0.78rem; color: #aaa; margin-left: auto; }
  </style>
</head>
<body>
  <h1>Laws of Thermodynamics</h1>
  <p class="subtitle">Four physical rules that govern all energy — explained plainly</p>
  <canvas id="c" height="320"></canvas>
  <p class="desc" id="desc"></p>
  <nav>
    <button id="prev">← Back</button>
    <button id="next">Next →</button>
    <span class="step-ct" id="ct"></span>
  </nav>

  <script>
  (function () {
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth || 720;
    let W = canvas.width, H = canvas.height;

    const BC = '#4a3a6b';

    function clear() { ctx.fillStyle = '#faf8f5'; ctx.fillRect(0, 0, W, H); }

    function txt(s, x, y, o) {
      o = o || {};
      ctx.save();
      ctx.font = (o.weight||'normal') + ' ' + (o.size||13) + 'px Georgia,serif';
      ctx.fillStyle = o.color || '#1a1a1a';
      ctx.textAlign = o.align || 'center';
      ctx.textBaseline = o.baseline || 'middle';
      if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
      ctx.fillText(s, x, y);
      ctx.restore();
    }

    function rr(x, y, w, h, r) {
      if (ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
    }

    function arr(x1, y1, x2, y2, color, lw) {
      color = color||'#888'; lw = lw||1.5;
      const ang = Math.atan2(y2-y1, x2-x1), hl = 9;
      ctx.save();
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2,y2);
      ctx.lineTo(x2-hl*Math.cos(ang-0.4), y2-hl*Math.sin(ang-0.4));
      ctx.lineTo(x2-hl*Math.cos(ang+0.4), y2-hl*Math.sin(ang+0.4));
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function banner(label) {
      ctx.save(); ctx.fillStyle = BC;
      ctx.beginPath(); rr(0,0,W,50,0); ctx.fill();
      ctx.font = 'bold 17px Georgia,serif'; ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, W/2, 25);
      ctx.restore();
    }

    function notebox(text1, text2) {
      const y = H*0.78;
      ctx.save();
      ctx.fillStyle = '#faf8f5';
      ctx.beginPath(); rr(W*0.05, y, W*0.9, 46, 5); ctx.fill();
      ctx.fillStyle = BC+'20'; ctx.strokeStyle = BC+'55'; ctx.lineWidth = 1;
      ctx.beginPath(); rr(W*0.05, y, W*0.9, 46, 5); ctx.fill(); ctx.stroke();
      ctx.restore();
      txt(text1, W/2, y+14, {size:11.5, color:BC, weight:'bold'});
      txt(text2, W/2, y+31, {size:11, color:'#333'});
    }

    function stickFigure(px, py, sc, running) {
      sc = sc||1;
      ctx.save(); ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2*sc;
      ctx.beginPath(); ctx.arc(px, py, 11*sc, 0, Math.PI*2); ctx.stroke();
      if (running) {
        ctx.beginPath(); ctx.moveTo(px, py+11*sc); ctx.lineTo(px+4*sc, py+38*sc); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px-18*sc, py+22*sc); ctx.lineTo(px+18*sc, py+26*sc); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px+4*sc, py+38*sc); ctx.lineTo(px-10*sc, py+60*sc); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px+4*sc, py+38*sc); ctx.lineTo(px+18*sc, py+56*sc); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(px, py+11*sc); ctx.lineTo(px, py+44*sc); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px-18*sc, py+24*sc); ctx.lineTo(px+18*sc, py+24*sc); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px, py+44*sc); ctx.lineTo(px-13*sc, py+68*sc); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px, py+44*sc); ctx.lineTo(px+13*sc, py+68*sc); ctx.stroke();
      }
      ctx.restore();
    }

    function sandwich(cx, cy, sc) {
      sc = sc||1;
      const bw = 64*sc, bh = 16*sc;
      // Bottom bread
      ctx.save(); ctx.fillStyle = '#c8902a'; ctx.globalAlpha = 0.9;
      ctx.beginPath(); rr(cx-bw/2, cy+8*sc, bw, bh, 4*sc); ctx.fill(); ctx.restore();
      // Filling
      ctx.save(); ctx.fillStyle = '#6a9a3a'; ctx.globalAlpha = 0.85;
      ctx.beginPath(); rr(cx-bw/2+4*sc, cy-4*sc, bw-8*sc, 14*sc, 2*sc); ctx.fill(); ctx.restore();
      // Top bread
      ctx.save(); ctx.fillStyle = '#c8902a'; ctx.globalAlpha = 0.9;
      ctx.beginPath(); rr(cx-bw/2, cy-18*sc, bw, bh, 4*sc); ctx.fill(); ctx.restore();
    }

    function thermometer(cx, cy) {
      // Tube
      ctx.save(); ctx.fillStyle = '#ddd'; ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
      ctx.beginPath(); rr(cx-6, cy-44, 12, 52, 6); ctx.fill(); ctx.stroke();
      // Mercury
      ctx.fillStyle = '#cc2020';
      ctx.beginPath(); rr(cx-3, cy-20, 6, 28, 3); ctx.fill();
      // Bulb
      ctx.beginPath(); ctx.arc(cx, cy+12, 9, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // ── Zeroth Law ────────────────────────────────────────────────────────────
    function drawZeroth() {
      clear(); banner('Zeroth Law · Temperature Is Comparable');

      txt('If two things are the same temperature as a third thing,', W/2, H*0.20, {size:12, weight:'bold'});
      txt('they are the same temperature as each other.', W/2, H*0.29, {size:12, weight:'bold'});

      const midY = H*0.57;

      // Left: hot cocoa mug
      const lx = W*0.18;
      ctx.save(); ctx.fillStyle = '#8b4513'; ctx.globalAlpha = 0.85;
      ctx.beginPath(); rr(lx-28, midY-22, 56, 44, 6); ctx.fill(); ctx.restore();
      ctx.save(); ctx.fillStyle = '#a0522d'; ctx.globalAlpha = 0.5;
      ctx.beginPath(); rr(lx+26, midY-10, 12, 20, 3); ctx.fill(); ctx.restore();
      txt('72°C', lx, midY-3, {size:13, weight:'bold', color:'#fff'});
      txt('hot cocoa', lx, midY+30, {size:10, color:'#444'});
      // steam
      [lx-8, lx, lx+8].forEach((sx, i) => {
        ctx.save(); ctx.strokeStyle = '#c06020'; ctx.globalAlpha = 0.4; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(sx, midY-24);
        ctx.quadraticCurveTo(sx+5, midY-34, sx, midY-44);
        ctx.quadraticCurveTo(sx-5, midY-54, sx, midY-64);
        ctx.stroke(); ctx.restore();
      });

      // Center: thermometer
      thermometer(W*0.50, midY+10);
      txt('72°C', W*0.50, midY-40, {size:12, weight:'bold', color:BC});
      txt('same reading', W*0.50, midY+30, {size:9.5, color:BC});

      // Right: soup bowl
      const rx = W*0.82;
      ctx.save(); ctx.fillStyle = '#c04010'; ctx.globalAlpha = 0.15;
      ctx.beginPath(); ctx.ellipse(rx, midY+10, 38, 14, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.7; ctx.strokeStyle = '#c04010'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(rx, midY+10, 38, 14, 0, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.fillStyle = '#d4600a'; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.ellipse(rx, midY, 36, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
      txt('72°C', rx, midY, {size:13, weight:'bold', color:'#fff'});
      txt('soup', rx, midY+30, {size:10, color:'#444'});

      // Connection lines
      arr(lx+30, midY-4, W*0.50-10, midY-14, '#bbb', 1.5);
      arr(W*0.50+10, midY-14, rx-30, midY-4, '#bbb', 1.5);

      // Therefore
      ctx.save(); ctx.strokeStyle = '#2a7a2a'; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(lx+30, midY+14); ctx.lineTo(rx-30, midY+14); ctx.stroke(); ctx.restore();
      txt('∴ same temperature — no heat will flow between them', W/2, midY+48, {size:10, color:'#2a7a2a'});

      notebox('This is why a thermometer works.',
        'It acts as the shared reference that lets you compare temperatures without touching things together.');
    }

    // ── First Law ─────────────────────────────────────────────────────────────
    function drawFirst() {
      clear(); banner('First Law · Nothing Disappears');

      txt('A kid eats a sandwich. The sandwich doesn\'t vanish.', W/2, H*0.20, {size:12, weight:'bold'});
      txt('It turns into three things — and they all add up to what went in.', W/2, H*0.29, {size:11, color:'#333'});

      // Sandwich (left)
      const sx = W*0.14, sy = H*0.55;
      sandwich(sx, sy, 1.1);
      txt('sandwich', sx, sy+28, {size:10, color:'#444'});

      // Arrow: eats
      arr(sx+42, sy, W*0.34-8, sy, '#888', 2);
      txt('eats it', (sx+42+W*0.34)/2, sy-14, {size:10, color:'#333'});

      // Kid eating (center)
      stickFigure(W*0.34, sy-22, 0.85, false);

      // Three output arrows
      const bx = W*0.34, by = sy;

      // 1. Running energy (top right)
      arr(bx+22, by-16, W*0.58, H*0.38, '#2a7a2a', 1.8);
      stickFigure(W*0.64, H*0.34, 0.75, true);
      txt('energy to run', W*0.70, H*0.31, {size:10, color:'#2a7a2a', align:'left'});
      txt('around at recess', W*0.70, H*0.31+14, {size:10, color:'#2a7a2a', align:'left'});

      // 2. Body heat (middle right)
      arr(bx+24, by, W*0.58, by, '#c04020', 1.8);
      [0,10,20].forEach(i => {
        ctx.save(); ctx.strokeStyle = '#c04020'; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(W*0.60+i, by);
        ctx.quadraticCurveTo(W*0.60+i+6, by-10, W*0.60+i, by-20);
        ctx.quadraticCurveTo(W*0.60+i-6, by-30, W*0.60+i, by-40);
        ctx.stroke(); ctx.restore();
      });
      txt('body heat', W*0.70, by-10, {size:10, color:'#c04020', align:'left'});
      txt('(you get sweaty)', W*0.70, by+4, {size:10, color:'#c04020', align:'left'});

      // 3. Waste (bottom right)
      arr(bx+22, by+16, W*0.58, H*0.72, '#8a6a20', 1.8);
      ctx.save(); ctx.fillStyle = '#8a6a20'; ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.ellipse(W*0.62, H*0.74, 16, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
      txt('bathroom trip later', W*0.70, H*0.72, {size:10, color:'#8a6a20', align:'left'});

      notebox('First Law: Energy is never created or destroyed — only changed in form.',
        'Running + sweating + digestion = exactly the energy that was in the sandwich. Nothing more, nothing less.');
    }

    // ── Lego brick helpers ────────────────────────────────────────────────────
    function legoBrick(cx, cy, w, h, col, angle) {
      ctx.save(); ctx.translate(cx, cy); if (angle) ctx.rotate(angle);
      ctx.fillStyle = col; ctx.globalAlpha = 0.88;
      ctx.beginPath(); rr(-w/2, -h/2, w, h, 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath(); rr(-w/2+2, -h/2+2, w-4, h*0.35, 1); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 0.8; ctx.globalAlpha = 1;
      ctx.beginPath(); rr(-w/2, -h/2, w, h, 2); ctx.stroke();
      ctx.restore();
    }

    const BKCOLS = ['#cc2020','#e09020','#2060cc','#20a040','#cccc20','#cc40a0','#808080'];

    function legoWall(cx, cy, sc) {
      sc = sc||1;
      const bw = 24*sc, bh = 13*sc, gap = 1;
      // 4 rows, staggered
      [
        [[-24,-19.5],[0,-19.5],[24,-19.5]],
        [[-12,-6.5], [12,-6.5],[36,-6.5],[-36,-6.5]],
        [[-24,6.5],  [0,6.5],  [24,6.5]],
        [[-12,19.5], [12,19.5],[36,19.5],[-36,19.5]],
      ].forEach((row, r) => {
        row.forEach(([dx,dy], c) => {
          legoBrick(cx+dx*sc, cy+dy*sc, bw-gap, bh-gap, BKCOLS[(r*4+c)%BKCOLS.length], 0);
        });
      });
    }

    function legoPile(cx, cy, sc) {
      sc = sc||1;
      const bricks = [
        [-30,22,0.42],[-6,30,-0.28],[22,18,0.55],[-22,8,-0.18],
        [34,28,0.30],[8,38,-0.48],[-28,36,0.12],[16,10,0.62],
        [38,12,-0.22],[-8,48,0.38],[28,42,0.18],[-18,20,-0.40],
      ];
      bricks.forEach(([dx,dy,a],i) => {
        legoBrick(cx+dx*sc, cy+dy*sc, 22*sc, 12*sc, BKCOLS[i%BKCOLS.length], a);
      });
    }

    // ── Second Law · Entropy ──────────────────────────────────────────────────
    function drawSecond() {
      clear(); banner('Second Law · Entropy · The One-Way Rule');

      txt('Disorder always increases. Some things only go in one direction. Ever.', W/2, H*0.20, {size:11.5, weight:'bold'});

      const pw = W*0.37, ph = H*0.32, py = H*0.29;
      const lx = W*0.04, rx = W*0.56;

      // Left panel: CAN HAPPEN
      ctx.save(); ctx.fillStyle = '#2a7a2a'; ctx.globalAlpha = 0.08;
      ctx.beginPath(); rr(lx, py, pw, ph, 8); ctx.fill();
      ctx.globalAlpha = 0.3; ctx.strokeStyle = '#2a7a2a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); rr(lx, py, pw, ph, 8); ctx.stroke(); ctx.restore();
      txt('CAN HAPPEN', lx+pw/2, py+13, {size:10, weight:'bold', color:'#2a7a2a'});
      legoWall(lx+pw/2, py+ph*0.52, 0.72);
      txt('organized Lego castle', lx+pw/2, py+ph*0.90, {size:9, color:'#2a7a2a'});

      // Center one-way arrow
      const acx = W*0.48, acy = py+ph*0.50;
      arr(lx+pw+6, acy, rx-6, acy, '#555', 2.5);
      txt('knock', acx, acy-14, {size:9, weight:'bold', color:'#333'});
      txt('it over', acx, acy-2, {size:9, weight:'bold', color:'#333'});
      ctx.save(); ctx.strokeStyle = '#cc2020'; ctx.lineWidth = 2; ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.moveTo(acx-7, acy+12); ctx.lineTo(acx+7, acy+24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(acx+7, acy+12); ctx.lineTo(acx-7, acy+24); ctx.stroke(); ctx.restore();
      txt('no return', acx, acy+34, {size:8.5, color:'#cc2020'});

      // Right panel: NEVER HAPPENS
      ctx.save(); ctx.fillStyle = '#8a1a1a'; ctx.globalAlpha = 0.08;
      ctx.beginPath(); rr(rx, py, pw, ph, 8); ctx.fill();
      ctx.globalAlpha = 0.3; ctx.strokeStyle = '#8a1a1a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); rr(rx, py, pw, ph, 8); ctx.stroke(); ctx.restore();
      txt('NEVER HAPPENS ON ITS OWN', rx+pw/2, py+13, {size:10, weight:'bold', color:'#8a1a1a'});
      legoPile(rx+pw/2, py+ph*0.56, 0.70);
      txt('scattered pile of bricks', rx+pw/2, py+ph*0.90, {size:9, color:'#8a1a1a'});

      // Coffee cooling strip below panels
      const cy2 = py+ph+10, cstrip = W*0.88, csx = W*0.06;
      txt('Heat always moves from hot → cold. Never the other way.', W/2, cy2+8, {size:10, color:'#333'});
      const cups = [
        {label:'just poured',  col:'#cc4010'},
        {label:'10 min later', col:'#c07030'},
        {label:'an hour later',col:'#888888'},
      ];
      cups.forEach((c, i) => {
        const cupX = csx + (i+0.5)*(cstrip/3);
        const cupY = cy2+22;
        ctx.save(); ctx.fillStyle = c.col; ctx.globalAlpha = 0.75;
        ctx.beginPath(); rr(cupX-12, cupY-8, 24, 16, 3); ctx.fill();
        ctx.strokeStyle = c.col; ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
        ctx.beginPath(); rr(cupX+10, cupY-3, 5, 10, 3); ctx.stroke(); ctx.restore();
        txt(c.label, cupX, cupY+12, {size:8.5, color:'#333'});
        if (i < 2) arr(cupX+16, cupY+2, cupX+cstrip/3-16, cupY+2, '#999', 1.2);
      });

      notebox('Second Law: Energy spreads out. Order falls apart. This is entropy.',
        'It\'s also why your coffee gets cold — heat moves from hot to cold until they equalise.');
    }

    // ── Third Law ─────────────────────────────────────────────────────────────
    function drawThird() {
      clear(); banner('Third Law · You Can Never Get All the Way There');

      txt('There is a coldest possible temperature: −273°C.', W/2, H*0.20, {size:12, weight:'bold'});
      txt('Each step toward it takes more effort than the last — and you never actually arrive.', W/2, H*0.28, {size:10.5, color:'#333'});

      // Shrinking boxes — each one smaller than the last, warm→cold top→bottom
      const boxLeft = W*0.06, boxRight = W*0.58, boxW = boxRight - boxLeft;
      const startY = H*0.35, gap = 8, floorY = H*0.83;

      const steps = [
        {temp:'20°C',   name:'room temperature', effort:'easy',            col:'#a05010', bg:'#f8ede0'},
        {temp:'4°C',    name:'refrigerator',      effort:'harder',          col:'#2a70a8', bg:'#e0eef8'},
        {temp:'−196°C', name:'liquid nitrogen',   effort:'very hard',       col:'#1a468a', bg:'#dce4f4'},
        {temp:'−272°C', name:'almost there',      effort:'near impossible', col:'#3a2a68', bg:'#e8e2f4'},
      ];

      // Heights shrink: ratio 3 : 2.2 : 1.6 : 1.0
      const ratios = [3, 2.2, 1.6, 1.0];
      const totalR = ratios.reduce((a,b) => a+b, 0);
      const availH = floorY - startY - gap*(steps.length-1) - 14;
      const unitH  = availH / totalR;
      const heights = ratios.map(r => Math.round(r * unitH));

      let y = startY;
      steps.forEach((s, i) => {
        const bh = heights[i], midY = y + bh/2;

        ctx.save(); ctx.fillStyle = s.bg;
        ctx.beginPath(); rr(boxLeft, y, boxW, bh, 3); ctx.fill();
        ctx.fillStyle = s.col;
        ctx.fillRect(boxLeft, y, 5, bh);
        ctx.globalAlpha = 0.35; ctx.strokeStyle = s.col; ctx.lineWidth = 1;
        ctx.beginPath(); rr(boxLeft, y, boxW, bh, 3); ctx.stroke();
        ctx.restore();

        if (bh >= 42) {
          txt(s.temp,   boxLeft+boxW/2, midY-10, {size:13, weight:'bold', color:s.col});
          txt(s.name,   boxLeft+boxW/2, midY+2,  {size:10.5, color:'#333'});
          txt(s.effort, boxLeft+boxW/2, midY+14, {size:9, color:BC});
        } else if (bh >= 26) {
          txt(s.temp, boxLeft+boxW/2, midY-6, {size:12, weight:'bold', color:s.col});
          txt(s.name + '  ·  ' + s.effort, boxLeft+boxW/2, midY+7, {size:9.5, color:'#333'});
        } else if (bh >= 16) {
          txt(s.temp + '   ' + s.name + '  ·  ' + s.effort, boxLeft+boxW/2, midY, {size:9, color:s.col, weight:'bold'});
        } else {
          txt(s.temp + '   ' + s.name, boxLeft+boxW/2, midY, {size:8.5, color:s.col});
        }

        y += bh + gap;
      });

      // Absolute zero floor
      y += 6;
      ctx.save(); ctx.strokeStyle = '#cc2020'; ctx.lineWidth = 2;
      ctx.setLineDash([6,4]); ctx.globalAlpha = 0.8;
      ctx.beginPath(); ctx.moveTo(boxLeft-8, y); ctx.lineTo(boxRight+8, y); ctx.stroke();
      ctx.restore();
      txt('−273°C  ·  absolute zero  ·  unreachable', boxLeft+boxW/2, y+13, {size:10.5, weight:'bold', color:'#cc2020'});

      // Right column: what this means
      const rx = W*0.64, rw = W*0.32;
      txt('What this means:', rx+rw/2, H*0.36, {size:10.5, weight:'bold', color:'#333'});
      [
        {t:'No engine can ever be',      col:'#333'},
        {t:'100% efficient',             col:BC},
        {t:'',                           col:''},
        {t:'There is always',            col:'#333'},
        {t:'some waste heat',            col:'#333'},
        {t:'',                           col:''},
        {t:'Not an engineering problem', col:'#333'},
        {t:'— a law of physics',         col:BC},
      ].forEach((l, i) => {
        if (!l.t) return;
        txt(l.t, rx+rw/2, H*0.36+20+i*17, {size:9.5, color:l.col});
      });

      notebox('Third Law: Absolute zero is the floor. You approach it — but never arrive.',
        '"100% efficiency" is not an engineering goal. It is physically forbidden.');
    }

    const STEPS = [
      { draw: drawZeroth,
        desc: 'The Zeroth Law sounds like it\'s stating the obvious — but it\'s actually establishing something essential: temperature is a real, measurable, comparable thing. If your hot cocoa and a thermometer reach the same temperature, and the same thermometer dropped into soup also reads the same, then the cocoa and soup are the same temperature — even without touching each other. This is why a thermometer works at all. Without this law, "80 degrees" in your coffee wouldn\'t mean the same thing as "80 degrees" somewhere else. It lets us compare temperature anywhere, through a shared reference.' },
      { draw: drawFirst,
        desc: 'The First Law: energy is never created or destroyed. A kid eats a sandwich. That sandwich doesn\'t disappear — it becomes energy to run around at recess, body heat (hence the sweating), and eventually some waste. All three of those things together add up to exactly the energy that was in the sandwich. Not more. Not less. This is why "free energy" doesn\'t exist. You can\'t build a machine that produces more power than you put in. Every process — a car engine, a solar panel, a human body — needs a real energy source, and everything that goes in comes out somewhere.' },
      { draw: drawSecond,
        desc: 'The Second Law: things fall apart on their own, but don\'t put themselves back together on their own. You can drop an egg and scramble it. You cannot un-scramble it. You can mix cream into coffee. You cannot un-mix it. A bedroom gets messy by itself — it never gets clean by itself. This is entropy: the universe reliably moves toward more disorder, never less. You can create order locally — clean the room, build a house, grow a plant — but only by doing work, and that work generates heat and waste somewhere else. The total disorder of everything always increases.' },
      { draw: drawThird,
        desc: 'The Third Law: there is a coldest possible temperature (−273.15°C, called absolute zero), and you can never actually reach it. Each step toward it requires more effort than the last — like trying to whisper quieter and quieter, there\'s always a little further to go. Because you can never get to absolute zero, you can never build a perfectly efficient engine — there\'s always some heat that escapes. This isn\'t a solvable engineering problem. It\'s a physical law. The Third Law sets a ceiling on how good any machine can ever be.' },
    ];

    let step = 0;
    const descEl  = document.getElementById('desc');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const ctEl    = document.getElementById('ct');

    function render() {
      STEPS[step].draw();
      descEl.textContent = STEPS[step].desc;
      prevBtn.disabled = (step === 0);
      nextBtn.disabled = (step === STEPS.length - 1);
      ctEl.textContent  = (step + 1) + ' of ' + STEPS.length;
    }

    prevBtn.addEventListener('click', () => { if (step > 0) { step--; render(); } });
    nextBtn.addEventListener('click', () => { if (step < STEPS.length-1) { step++; render(); } });

    render();
    window.addEventListener('resize', () => { canvas.width = canvas.offsetWidth; W = canvas.width; render(); });
  })();
  </script>
  <script src="nav.js"></script>
</body>
</html>
